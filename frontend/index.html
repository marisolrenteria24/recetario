<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recetario</title>

    <link rel="stylesheet" href="styles.css">
</head>


<body>


<!-- =========================
     LOGIN / REGISTRO
========================== -->

<section id="authSection" class="auth-section">


    <div class="auth-card">


        <h1>🍳 Recetario</h1>

        <p class="subtitle">
            Descubre y guarda tus recetas favoritas
        </p>



        <div class="tabs">

            <button id="loginTab" class="active">
                Iniciar sesión
            </button>


            <button id="registerTab">
                Registrarse
            </button>

        </div>





        <!-- LOGIN -->

        <form id="loginForm">


            <input 
                id="loginEmail"
                type="email"
                placeholder="Correo electrónico"
                required
            >


            <input
                id="loginPassword"
                type="password"
                placeholder="Contraseña"
                required
            >


            <button type="submit">
                Entrar
            </button>


        </form>





        <!-- REGISTRO -->


        <form id="registerForm" class="hidden">


            <input
                id="registerName"
                type="text"
                placeholder="Nombre"
                required
            >



            <input
                id="registerLastName"
                type="text"
                placeholder="Apellido"
                required
            >



            <input
                id="registerEmail"
                type="email"
                placeholder="Correo"
                required
            >



            <input
                id="registerPassword"
                type="password"
                placeholder="Contraseña"
                required
            >



            <button type="submit">
                Crear cuenta
            </button>


        </form>




        <p id="authMessage"></p>


    </div>


</section>









<!-- =========================
     APLICACIÓN
========================== -->


<section id="appSection" class="hidden">



<header class="navbar">


    <h2>
        🍳 Recetario
    </h2>



    <div class="session">


        <span id="sessionText">
            Sin sesión
        </span>



        <button id="logoutButton">
            Cerrar sesión
        </button>


    </div>


</header>







<main class="container">



    <section class="search-box">


        <form id="searchForm">


            <input 
                id="searchInput"
                type="text"
                placeholder="Buscar receta..."
            >


            <button type="submit">
                Buscar
            </button>


        </form>


    </section>







    <section class="views">


        <button 
        id="recipesViewButton"
        class="active">

            Recetas

        </button>




        <button 
        id="favoritesViewButton">

            ❤️ Favoritos

        </button>



    </section>







    <p id="recipesMessage"></p>







    <section id="recipeGrid" class="recipe-grid">

    </section>







</main>



</section>









<!-- =========================
     TARJETA RECETA TEMPLATE
========================== -->


<template id="recipeCardTemplate">


<article class="recipe-card">


    <img 
    class="recipe-image"
    src=""
    alt="receta">



    <div class="recipe-info">


        <h3 class="recipe-title">
            
        </h3>



        <p class="recipe-meta">

        </p>




        <div class="actions">


            <a 
            class="recipe-link"
            href="#"
            target="_blank">

                Ver receta

            </a>



            <button 
            class="favorite-button">

                ☆

            </button>



        </div>

        


        

    </div>


</article>


</template>





<script src="app.js"></script>


</body>

</html>
